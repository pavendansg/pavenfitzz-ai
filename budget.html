<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PavenFitzz Budget Planner</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
}

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

.ai-header{
  text-align:center;
  margin-bottom:35px;
}

.ai-logo{
  font-size:70px;
}

.ai-title{
  font-size:42px;
  font-weight:700;
  color:#ffd000;
  margin-top:10px;
}

.ai-subtitle{
  color:#aaa;
  margin-top:12px;
  font-size:17px;
}

.goal-box{
  background:linear-gradient(
  90deg,
  #082a18,
  #062012
  );

  border:1px solid #00ff88;
  border-radius:20px;
  padding:22px;
  margin-bottom:28px;
  line-height:1.9;
  font-size:18px;
}

.box{
  background:#131313;
  border-radius:24px;
  padding:28px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 25px rgba(0,0,0,0.5);
}

.input-label{
  display:block;
  margin-top:22px;
  margin-bottom:10px;
  color:#888;
  font-weight:700;
  letter-spacing:1px;
}

input,select{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#222;
  color:white;
  font-size:17px;
}

.generate-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  margin-top:30px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;

  background:linear-gradient(
  90deg,
  #00ff88,
  #00c3ff
  );

  color:black;
}

.result{
  margin-top:30px;
}

.section-card{
  background:#131313;
  border-left:5px solid #00ff88;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

.section-title{
  color:#00ff88;
  font-size:24px;
  font-weight:700;
  margin-bottom:15px;
}

.result-line{
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
  line-height:1.8;
}

.loading{
  text-align:center;
  padding:35px;
  color:#00ff88;
  font-size:18px;
}

.tip-box{
  background:#101010;
  border-radius:18px;
  padding:20px;
  margin-top:22px;
  line-height:1.8;
  color:#bbb;
}

.next-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  margin-top:22px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;

  background:linear-gradient(
  90deg,
  #ffd000,
  #ff9900
  );

  color:black;
}

.error-box{
  background:#2a1111;
  color:#ff7777;
  padding:20px;
  border-radius:18px;
  margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

  <div class="ai-header">

    <div class="ai-logo">💰</div>

    <div class="ai-title">
      AI Budget Diet Planner
    </div>

    <div class="ai-subtitle">
      Smart nutrition based on your
      workout goal
    </div>

  </div>

  <div class="goal-box">

    <strong>Current Workout Goal:</strong>
    <span id="goalText"></span>

    <br><br>

    <strong>Workout Split:</strong>
    <span id="splitText"></span>

  </div>

  <div class="box">

    <label class="input-label">
      DAILY BUDGET (₹)
    </label>

    <input type="number"
    id="budget"
    placeholder="e.g. 200">

    <label class="input-label">
      FOOD PREFERENCE
    </label>

    <select id="foodType">

      <option>Non-Veg</option>
      <option>Veg</option>

    </select>

    <label class="input-label">
      SUPPLEMENTS
    </label>

    <select id="supplements">

      <option>No</option>
      <option>Yes</option>

    </select>

    <button class="generate-btn"
    onclick="generateBudgetPlan()">

      Generate Budget Plan 🔥

    </button>

  </div>

  <div id="budgetResult"
  class="result"></div>

</div>

<script>

const WORKER_URL =
"https://pavenfitzz-ai.pavendansg.workers.dev/";

const goal =
localStorage.getItem("goal")
|| "Bulk";

const split =
localStorage.getItem("split")
|| "PPL";

document.getElementById(
  "goalText"
).innerText = goal;

document.getElementById(
  "splitText"
).innerText = split;

window.onload = function(){

  const savedBudget =
  localStorage.getItem(
    "generatedBudget"
  );

  const savedDate =
  localStorage.getItem(
    "budgetDate"
  );

  const today =
  new Date().toDateString();

  if(
    savedBudget &&
    savedDate === today
  ){

    renderBudget(savedBudget);

  }

}

async function generateBudgetPlan(){

  const budget =
  document.getElementById("budget")
  .value;

  const foodType =
  document.getElementById("foodType")
  .value;

  const supplements =
  document.getElementById("supplements")
  .value;

  const result =
  document.getElementById("budgetResult");

  if(!budget || budget < 50){

    alert(
      "Enter a valid budget"
    );

    return;

  }

  result.innerHTML = `
  <div class="loading">

  🤖 AI Nutrition Coach is
  creating your budget plan...

  </div>
  `;

  const prompt = `
Create a REALISTIC Indian BULKING diet.

Goal: ${goal}
Budget Limit: Rs.${budget}
Food Type: ${foodType}

STRICT RULES:
- TOTAL COST MUST STAY under Rs.${budget}
- Minimum 2500 calories
- Minimum 110g protein
- Use cheap Indian foods
- Same meals for entire day
- NO random expensive items
- NO whey protein
- NO supplements
- Keep clean and short

FORMAT:

Shopping List:
- item = Rs.price

Meal Plan:

Breakfast:
- foods

Lunch:
- foods

Snack:
- foods

Dinner:
- foods

Total Calories:
Total Protein:
Total Cost:
`;

  try{

    const res = await fetch(WORKER_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        prompt:prompt
      })

    });

    const data =
    await res.json();

    console.log(data);

    const text =
    data.text || "No response";

    if(
      text.includes("Mass Gainer")
      ||
      text.includes("Protein Powder")
      ||
      text.includes("Whey")
    ){

      result.innerHTML = `
      <div class="error-box">

      ⚠️ AI generated expensive items.
      Please regenerate.

      </div>
      `;

      return;

    }

    localStorage.setItem(
      "generatedBudget",
      text
    );

    localStorage.setItem(
      "budgetDate",
      new Date().toDateString()
    );

    renderBudget(text);

  }

  catch(err){

    console.log(err);

    result.innerHTML = `
    <div class="error-box">

    ⚠️ ${err.message}

    </div>
    `;

  }

}

function renderBudget(text){

  const result =
  document.getElementById(
    "budgetResult"
  );

  const lines =
  text.split("\n")
  .filter(line => line.trim());

  let html = "";

  let currentSection = false;

  lines.forEach(line => {

    const cleanLine =
    line.trim();

    if(
      cleanLine.includes("Shopping")
      ||
      cleanLine.includes("Meal")
      ||
      cleanLine.includes("Breakfast")
      ||
      cleanLine.includes("Lunch")
      ||
      cleanLine.includes("Dinner")
      ||
      cleanLine.includes("Snack")
      ||
      cleanLine.includes("Calories")
      ||
      cleanLine.includes("Protein")
      ||
      cleanLine.includes("Total")
    ){

      if(currentSection){
        html += `</div>`;
      }

      html += `
      <div class="section-card">

        <div class="section-title">
        ${cleanLine}
        </div>
      `;

      currentSection = true;

    }

    else{

      html += `
      <div class="result-line">

      ${cleanLine}

      </div>
      `;

    }

  });

  if(currentSection){
    html += `</div>`;
  }

  html += `

  <div class="tip-box">

  ✅ This nutrition plan is locked
  for today and will refresh tomorrow.

  Stay consistent with hydration,
  sleep and training.

  </div>

  <button class="next-btn"
  onclick="goMealPlanner()">

  Continue to Meal Planner →

  </button>

  `;

  result.innerHTML = html;

}

function goMealPlanner(){

  window.location.href =
  "meal.html";

}

</script>

</body>
</html>
