<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PavenFitzz Workout Coach</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.ai-header{
  text-align:center;
  margin-bottom:35px;
}

.ai-logo{
  font-size:65px;
}

.ai-title{
  font-size:38px;
  font-weight:700;
  margin-top:10px;
}

.ai-subtitle{
  color:#aaa;
  margin-top:10px;
}

.box{
  background:#151515;
  border-radius:24px;
  padding:28px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 25px rgba(0,0,0,0.5);
}

.input-label{
  display:block;
  margin-top:22px;
  margin-bottom:10px;
  font-weight:700;
  color:#888;
  letter-spacing:1px;
}

select{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#222;
  color:white;
  font-size:17px;
}

.generate-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  margin-top:28px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;

  background:linear-gradient(
  90deg,
  #00ff88,
  #00c3ff
  );

  color:black;
}

.result{
  margin-top:30px;
}

.day-card{
  background:#151515;
  border-left:5px solid #00ff88;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

.day-title{
  color:#00ff88;
  font-size:24px;
  font-weight:700;
  margin-bottom:15px;
}

.exercise{
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
  line-height:1.8;
}

.loading{
  text-align:center;
  padding:35px;
  color:#00ff88;
  font-size:18px;
}

.lock-box{
  background:#102218;
  border:1px solid #00ff88;
  border-radius:16px;
  padding:18px;
  margin-top:25px;
  line-height:1.7;
}

.confirm-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  margin-top:20px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  background:#00ff88;
  color:black;
}

.next-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  margin-top:15px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  background:#00c3ff;
  color:black;
}

.error-box{
  background:#2a1111;
  color:#ff7777;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

  <div class="ai-header">

    <div class="ai-logo">💪</div>

    <div class="ai-title">
      AI Workout Coach
    </div>

    <div class="ai-subtitle">
      Personalized Fitness Program Generator
    </div>

  </div>

  <div class="box">

    <label class="input-label">
      FITNESS GOAL
    </label>

    <select id="goal">
      <option>Bulk</option>
      <option>Cut</option>
      <option>Maintain</option>
      <option>Athletic</option>
    </select>

    <label class="input-label">
      EXPERIENCE LEVEL
    </label>

    <select id="level">
      <option>Beginner</option>
      <option>Intermediate</option>
      <option>Advanced</option>
    </select>

    <label class="input-label">
      WORKOUT SPLIT
    </label>

    <select id="split">
      <option>PPL</option>
      <option>Bro Split</option>
      <option>Upper Lower</option>
      <option>Full Body</option>
    </select>

    <label class="input-label">
      WORKOUT DAYS PER WEEK
    </label>

    <select id="days">
      <option>3</option>
      <option>4</option>
      <option>5</option>
      <option>6</option>
    </select>

    <button class="generate-btn"
    onclick="generateWorkout()">

      Generate My Program 🔥

    </button>

  </div>

  <div id="workoutResult"
  class="result"></div>

</div>

<script>

const WORKER_URL =
"https://pavenfitzz-ai.pavendansg.workers.dev/";

async function generateWorkout(){

  const goal =
  document.getElementById("goal").value;

  const level =
  document.getElementById("level").value;

  const split =
  document.getElementById("split").value;

  const days =
  document.getElementById("days").value;

  const result =
  document.getElementById("workoutResult");

  result.innerHTML = `
  <div class="loading">

    🤖 AI Coach is generating your
    personalized workout...

  </div>
  `;

  const prompt = `
Create a ${days}-day ${split} workout plan.

Goal: ${goal}
Level: ${level}

Format:

DAY 1: CHEST
- Exercise
- Sets x Reps

Keep concise and professional.
`;

  try{

    const res = await fetch(WORKER_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        prompt:prompt
      })

    });

    const data =
    await res.json();

    console.log(data);

    const text =
    data.text || "No response";

    localStorage.setItem(
      "generatedWorkout",
      text
    );

    localStorage.setItem(
      "goal",
      goal
    );

    localStorage.setItem(
      "level",
      level
    );

    localStorage.setItem(
      "split",
      split
    );

    localStorage.setItem(
      "days",
      days
    );

    const lines =
    text.split("\n")
    .filter(line => line.trim());

    let html = "";

    let currentCard = false;

    lines.forEach(line => {

      const cleanLine =
      line.trim();

      if(
        cleanLine.toLowerCase().includes("day")
      ){

        if(currentCard){
          html += `</div>`;
        }

        html += `
        <div class="day-card">

          <div class="day-title">
            ${cleanLine}
          </div>
        `;

        currentCard = true;

      }

      else{

        html += `
        <div class="exercise">
          ${cleanLine}
        </div>
        `;

      }

    });

    if(currentCard){
      html += `</div>`;
    }

    html += `

    <div class="lock-box">

      ⚠️ This workout program will remain
      fixed until your workout cycle ends.

    </div>

    <button class="confirm-btn"
    onclick="lockProgram()">

      ✅ Confirm & Lock Program

    </button>

    <button class="next-btn"
    onclick="goBudget()">

      Continue to Budget Planning →

    </button>

    `;

    result.innerHTML = html;

  }

  catch(err){

    console.log(err);

    result.innerHTML = `

    <div class="error-box">

      ⚠️ ${err.message}

    </div>

    `;

  }

}

function lockProgram(){

  localStorage.setItem(
    "programLocked",
    "true"
  );

  alert(
    "Workout Program Locked 🔥"
  );

}

function goBudget(){

  window.location.href =
  "budget.html";

}

</script>

</body>
</html>
